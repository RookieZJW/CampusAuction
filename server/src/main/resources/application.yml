spring:
  application:
    name: campus-auction-server
  profiles:
    # dev 提供结构骨架；local 存放本机密钥（已 gitignore，缺失不影响启动）
    active: dev,local
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  # 启动时自动执行幂等 DDL：把认证资料持久化到 t_user（等价于 sql/migration/2026-11-21-user-auth-persist.sql）
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 微信小程序配置：值从环境变量或 application-local.yml 注入
wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  # mock=true 时不调微信接口，openid 用本地生成的模拟值（开发期联调用）
  mock: ${WX_MOCK:true}

jwt:
  # 生产环境务必更换并放入环境变量；HS256 要求密钥至少 32 字符
  secret: ${JWT_SECRET:campus-auction-dev-secret-key-change-me-2026-1234567890}
  expire-days: 7

# 图片上传目录（相对 server 运行目录）；生产环境改为绝对路径
upload:
  dir: ${UPLOAD_DIR:./uploads}

# AI 定价建议：Key 仅从环境变量或 application-local.yml 注入，不入库不入 git
# 未配置 Key 或调用失败时自动降级为规则估价，功能不中断
ai:
  price:
    enabled: ${AI_PRICE_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_PRICE_KEY:}
    model: ${AI_MODEL:deepseek-chat}

# 可插拔支付网关（方案 B）
# provider=mock 时启用模拟支付（答辩演示，零合规风险）；
# provider=wxpay 时切换到微信支付实现骨架，需商户号/APIv3 证书/公网回调，默认不启用。
payment:
  provider: ${PAYMENT_PROVIDER:mock}
  # 是否强制「先支付再确认交割」：默认 false，保留线下面交演示链路
  require-before-complete: ${PAYMENT_REQUIRE_BEFORE_COMPLETE:false}
  wxpay:
    mch-id: ${WXPAY_MCH_ID:}
    app-id: ${WXPAY_APP_ID:}
    api-v3-key: ${WXPAY_API_V3_KEY:}
    notify-url: ${WXPAY_NOTIFY_URL:}

spring.servlet.multipart:
  max-file-size: 3MB
  max-request-size: 10MB
