spring:
  application:
    name: campus-auction-server
  profiles:
    # dev 提供结构骨架；local 存放本机密钥（已 gitignore，缺失不影响启动）
    active: dev,local
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 微信小程序配置：值从环境变量或 application-local.yml 注入
wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  # mock=true 时不调微信接口，openid 用本地生成的模拟值（开发期联调用）
  mock: ${WX_MOCK:true}

jwt:
  # 生产环境务必更换并放入环境变量；HS256 要求密钥至少 32 字符
  secret: ${JWT_SECRET:campus-auction-dev-secret-key-change-me-2026-1234567890}
  expire-days: 7

# 图片上传目录（相对 server 运行目录）；生产环境改为绝对路径
upload:
  dir: ${UPLOAD_DIR:./uploads}

spring.servlet.multipart:
  max-file-size: 3MB
  max-request-size: 10MB
